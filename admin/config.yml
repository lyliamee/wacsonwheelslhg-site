# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: lyliamee/wacsonwheelslhg-site
  branch: main
  identity_url: https://auth.decapbridge.com/sites/80de2268-85c6-477b-9c5c-d0d6674c6639
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://wacsonwheelslhg.nl

media_folder: "images"
public_folder: "images"

collections:
  - name: "events"
    label: "Evenementen"
    files:
      - name: "events"
        label: "Evenementenkalender"
        file: "data/events.json"
        fields:
          - label: "Evenementen"
            name: "events"
            widget: "list"
            summary: "{{title}} — {{date_display}}"
            fields:
              - {label: "Datum (weergave op de site)", name: "date_display", widget: "string", hint: "Bijv. 18–20 September"}
              - {label: "Datum (voor sortering, laatste dag)", name: "date_iso", widget: "date", format: "YYYY-MM-DD"}
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Naam locatie", name: "venue_name", widget: "string", required: false}
              - {label: "Link naar locatie (optioneel)", name: "venue_url", widget: "string", required: false}
              - {label: "Plaats / land (Engels)", name: "location_en", widget: "string", required: false}
              - {label: "Plaats / land (Nederlands)", name: "location_nl", widget: "string", required: false}
              - {label: "Details bij 'Meer info' (Engels)", name: "details_en", widget: "markdown"}
              - {label: "Details bij 'Meer info' (Nederlands)", name: "details_nl", widget: "markdown"}
  - name: "lectures"
    label: "Lezingen"
    files:
      - name: "lectures"
        label: "Lezingenoverzicht"
        file: "data/lectures.json"
        fields:
          - label: "Lezingen"
            name: "lectures"
            widget: "list"
            summary: "{{title}} — {{date_display}}"
            fields:
              - {label: "Datum (weergave op de site)", name: "date_display", widget: "string"}
              - {label: "Datum (voor sortering)", name: "date_iso", widget: "date", format: "YYYY-MM-DD"}
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Bij welk evenement", name: "event_name", widget: "string"}
              - {label: "Naam locatie", name: "venue_name", widget: "string"}
              - {label: "Link naar locatie (optioneel)", name: "venue_url", widget: "string", required: false}
              - {label: "Opmerking (Engels)", name: "note_en", widget: "string"}
              - {label: "Opmerking (Nederlands)", name: "note_nl", widget: "string"}
  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage inhoud"
        file: "data/home.json"
        fields:
          - {label: "Kop boven titel (Engels)", name: "hero_kicker_en", widget: "string"}
          - {label: "Kop boven titel (Nederlands)", name: "hero_kicker_nl", widget: "string"}
          - {label: "Titel (Engels)", name: "hero_title_en", widget: "string"}
          - {label: "Titel (Nederlands)", name: "hero_title_nl", widget: "string"}
          - {label: "Ondertekst (Engels)", name: "hero_text_en", widget: "text"}
          - {label: "Ondertekst (Nederlands)", name: "hero_text_nl", widget: "text"}
          - {label: "Groepsfoto op homepage", name: "photo", widget: "image"}
          - {label: "Korte 'Over ons' tekst (Engels)", name: "teaser_en", widget: "text"}
          - {label: "Korte 'Over ons' tekst (Nederlands)", name: "teaser_nl", widget: "text"}
  - name: "about"
    label: "Over ons pagina"
    files:
      - name: "about"
        label: "Over ons inhoud"
        file: "data/about.json"
        fields:
          - {label: "Groepsfoto", name: "photo", widget: "image"}
          - {label: "Over ons tekst (Engels)", name: "about_en", widget: "markdown"}
          - {label: "Over ons tekst (Nederlands)", name: "about_nl", widget: "markdown"}
          - {label: "Flyer afbeelding", name: "flyer_image", widget: "image"}
          - {label: "Word lid tekst (Engels)", name: "member_text_en", widget: "markdown"}
          - {label: "Word lid tekst (Nederlands)", name: "member_text_nl", widget: "markdown"}
  - name: "contact"
    label: "Contact pagina"
    files:
      - name: "contact"
        label: "Contact inhoud"
        file: "data/contact.json"
        fields:
          - {label: "Introductietekst (Engels)", name: "intro_en", widget: "markdown"}
          - {label: "Introductietekst (Nederlands)", name: "intro_nl", widget: "markdown"}
